# =====================================================================
#  EMPEZÁ POR ACÁ. Todo lo marcado con CAMBIAR se puede editar.
#  Después de guardar (commit), GitHub actualiza el sitio en un minuto.
# =====================================================================

# CAMBIAR: el nombre grande arriba del menú y en la pestaña del navegador.
title: liucha

# CAMBIAR: la línea chica debajo del nombre.
tagline: 

# CAMBIAR: el texto de la página de inicio.
intro: 
intro_place:

# CAMBIAR: los links que aparecen en el menú, debajo de las series de obras.
# Se pueden agregar, borrar o reordenar. Cada uno necesita name y url.
# Los que empiezan con / son páginas de este mismo sitio.
links:
  - name: sobre mí
    url: /sobre-mi/
  - name: contacto
    url: /contacto/

# CAMBIAR: la dirección del sitio.
#   Repo llamado  TU-USUARIO.github.io  -> url: https://TU-USUARIO.github.io   baseurl: ""
#   Repo con otro nombre (ej. arte)     -> url: https://TU-USUARIO.github.io   baseurl: "/arte"
url: "https://TU-USUARIO.github.io"
baseurl: ""

lang: es

# ---------------------------------------------------------------------
#  De acá para abajo no hace falta tocar nada.
# ---------------------------------------------------------------------
collections:
  albums:
    output: true
    permalink: /:path/

defaults:
  - scope:
      type: albums
    values:
      layout: album

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
